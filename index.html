<style>
:root { --bg:#0c0609; --card:#170b10; --ink:#f4ece4; --dim:#c9bdb4;
  --faint:#8d8079; --red:#c8102e; --gold:#e8bd6a; }
* { box-sizing: border-box; }
body { margin:0; background:radial-gradient(circle at 50% 0, #3a0710, var(--bg) 60%);

.date { color:var(--faint); font-size:13px; margin-bottom:16px; }
h2 { color:var(--gold); font-size:18px; font-weight:900; margin:24px 0 6px; }
p { color:var(--dim); margin:0 0 10px; }
ul { margin:0 0 10px; padding-inline-start:22px; }
li { margin-bottom:6px; }
li::marker { color:var(--red); }
nav { margin-top:22px; text-align:center; font-size:14px; }
nav a { color:var(--gold); text-decoration:none; margin:0 10px; }
